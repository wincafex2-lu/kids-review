name: 檢查題庫並更新網站

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 檢查題庫格式並產生目錄
        run: node tools/build-index.mjs
      - name: 準備網站檔案
        if: github.event_name != 'pull_request'
        run: |
          mkdir _site
          cp -r *.html assets data _site/
          # 每次更新都換新的版本號，避免平板／手機用到舊的程式檔而打不開。
          # 自動處理所有頁面裡的 assets/….js 和 assets/….css，新增頁面或檔案不用改這裡。
          v="${GITHUB_SHA::8}"
          for f in _site/*.html; do
            sed -i -E "s#((src|href)=\"assets/[^\"?]+\.(js|css))\"#\\1?v=$v\"#g" "$f"
            if grep -Eq '(src|href)="assets/[^"?]+\.(js|css)"' "$f"; then echo "::error::$f 還有沒加版本號的檔案"; exit 1; fi
          done
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

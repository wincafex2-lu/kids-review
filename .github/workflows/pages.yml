name: 檢查題庫並更新網站

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 檢查題庫格式並產生目錄
        run: node tools/build-index.mjs
      - name: 準備網站檔案
        if: github.event_name != 'pull_request'
        run: |
          mkdir _site
          cp -r index.html spy.html assets data _site/
          # 每次更新都換新的版本號，避免平板／手機用到舊的程式檔而打不開
          v="${GITHUB_SHA::8}"
          sed -i "s#assets/style.css\"#assets/style.css?v=$v\"#; s#assets/app.js\"#assets/app.js?v=$v\"#" _site/index.html
          grep -q "app.js?v=$v" _site/index.html
          sed -i "s#assets/spy.css\"#assets/spy.css?v=$v\"#; s#assets/spy.js\"#assets/spy.js?v=$v\"#; s#assets/people/people-sprites.js\"#assets/people/people-sprites.js?v=$v\"#; s#assets/people/people.js\"#assets/people/people.js?v=$v\"#" _site/spy.html
          grep -q "spy.js?v=$v" _site/spy.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17131f">
<title>洞穴大冒險</title>
<meta name="description" content="闖過四個洞穴關卡收集寶石，最後答對題目打倒洞穴大魔王。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="assets/games/games.css">
<link rel="stylesheet" href="assets/cave/cave.css">
<!-- 點陣人物：Agent 辦公室 W003-1（© 泓，LicenseRef-AgentOffice-AllRightsReserved），經作者同意用在本站 -->
<script src="assets/people/people-sprites.js" defer></script>
<script src="assets/people/people.js" defer></script>
<script src="assets/games/art.js" defer></script>
<script src="assets/cave/cave-art.js" defer></script>
<script src="assets/games/games-core.js" defer></script>
<script src="assets/cave/cave.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>洞穴大冒險</h1><small>闖四關、收集寶石、打倒魔王 · <a class="home" href="games.html">所有小遊戲</a> · <a class="home" href="./">回複習小書</a></small></div>
    <div class="hud" aria-live="polite">
      <span class="chip"><b id="room">洞口</b></span>
      <span class="chip" id="hearts" role="img" aria-label="愛心"></span>
      <span class="chip"><img class="px" alt="寶石" id="gemico" src="data:,"> <b id="gems">0</b></span>
      <button class="mute" id="mute" aria-pressed="false" title="音效開關">🔊</button>
    </div>
  </header>
  <section class="qcard" id="qcard" hidden>
    <div class="meta"><span class="game" id="gname"></span><span id="qsrc"></span></div>
    <p class="passage" id="qpass" hidden></p>
    <p class="q" id="qtext"></p>
    <p class="how" id="qhow"></p>
  </section>
  <div class="play">
    <section class="stage" id="stage" aria-label="遊戲畫面"></section>
    <section class="panel verdict" id="verdict" hidden aria-live="polite"></section>
  </div>
  <section class="panel" id="setup"></section>
</div>
</body>
</html>

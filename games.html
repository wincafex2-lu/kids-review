<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1b2e">
<title>最後一刻揭曉｜答題小遊戲</title>
<meta name="description" content="是非、選擇、題組各有自己的小遊戲，選完先播動畫，最後一刻才揭曉對錯。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="assets/games/games.css">
<!-- 點陣人物：本站原創的大頭點陣人物（assets/people/chibi.js） -->
<script src="assets/common.js" defer></script>
<script src="assets/people/chibi.js" defer></script>
<script src="assets/games/art.js" defer></script>
<script src="assets/games/art2.js" defer></script>
<script src="assets/sfx.js" defer></script>
<script src="assets/games/games-core.js" defer></script>
<script src="assets/games/games.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>最後一刻揭曉</h1><small>全部的答題小遊戲都在這裡 · <a class="home" href="./">回複習小書</a></small></div>
    <div class="hud" aria-live="polite">
      <span class="chip">第 <b id="qn">0</b>/<span id="qt">–</span> 題</span>
      <span class="chip">答對 <b id="score">0</b></span>
      <button class="mute" id="mute" aria-pressed="false" title="音效開關">🔊</button>
    </div>
  </header>
  <section class="qcard" id="qcard" hidden>
    <div class="meta"><span class="game" id="gname"></span><span id="qsrc"></span></div>
    <p class="passage" id="qpass" hidden></p>
    <p class="q" id="qtext"></p>
    <p class="how" id="qhow"></p>
  </section>
  <div class="play">
    <section class="stage" id="stage" aria-label="遊戲畫面"></section>
    <section class="panel verdict" id="verdict" hidden aria-live="polite"></section>
  </div>
  <section class="panel" id="setup"></section>
</div>
</body>
</html>
